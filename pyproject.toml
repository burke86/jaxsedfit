[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jaxsedfit"
version = "0.1.0"
description = "Single-source GRAHSP-style photometric fitting with JAX + NumPyro"
readme = "README.md"
requires-python = ">=3.12"
authors = [
  { name = "jaxsedfit contributors" }
]
dependencies = [
  "numpy>=2.2",
  "scipy",
  "astropy",
  "tqdm",
  "extinction",
  "matplotlib",
  "corner",
  "h5py",
  "jax==0.12.1",
  "jaxlib==0.12.1",
  "numpyro==0.22.0",
  "optax",
  "dsps",
  "diffstar",
  "dustmaps",
]

[project.optional-dependencies]
# Nested sampling (inference.method = "ns") through numpyro's jaxns wrapper.
# jaxns 3 is a rewrite without the API numpyro wraps, so jaxns stays at 2.6.9;
# it needs the TensorFlow Probability nightly build (no TFP release supports
# current JAX).
ns = [
  "jaxns==2.6.9",
  "tfp-nightly==0.26.0.dev20261127",
]

[project.scripts]
jaxsedfit = "jaxsedfit.run:main"
jaxsedfit-benchmark = "jaxsedfit.benchmark:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
jaxsedfit = ["resources/filters/filter_registry.txt", "resources/filters/**/*.dat", "resources/filters/*.dat", "resources/nebular/*.npz", "resources/templates/*", "resources/templates/dale2014/*", "resources/styles/*.mplstyle"]
